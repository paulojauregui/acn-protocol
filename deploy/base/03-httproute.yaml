apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: acn-protocol
  labels:
    app.kubernetes.io/name: acn-protocol
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: argocd
  hostnames:
    - acn.paulojauregui.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: acn-protocol
          port: 80
